<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="victory-banner" id="victory-banner" style="display: none;">
            <div class="victory-content">
                <h2>🎉 Congratulations! 🎉</h2>
                <p>You've squashed more than<span id="win-condition-count"></span> bugs! You have what it takes to be a software engineer!</p>
                <div class="trophy">🏆</div>
            </div>
        </div>
        <div class="program-info">
            <h1>Debugging Simulator</h1>
            <div class="program-navigation">
                <button id="prev-program">←</button>
                <button id="next-program">→</button>
            </div>
            <div id="program-description"></div>
        </div>
        <div class="stats-container">
            <div class="bug-counter">
                <span class="counter-icon">🔨</span>
                <span class="counter-label">Bugs Squashed:</span>
                <span id="bugs-squashed">0</span>
            </div>
        </div>
        <div class="bug-container">
            <h2>Current Bugs</h2>
            <div class="bug-banner">
                <span>🐛 Left click to squash bugs! Let's make this code shine!✨</span>
            </div>
            <ul id="bug-list"></ul>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
