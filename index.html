<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="program-info">
            <h1>Debugging Simulator</h1>
            <div class="program-navigation">
                <button id="prev-program">←</button>
                <button id="next-program">→</button>
            </div>
            <div id="program-description"></div>
        </div>
        <div class="bug-container">
            <h2>Current Bugs</h2>
            <div class="bug-banner">
                <span>🐛 Left click to squash bugs! Right click to show/hide error details! Let's make this code shine!✨</span>
            </div>
            <ul id="bug-list"></ul>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
